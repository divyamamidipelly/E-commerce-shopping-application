let users = [];

let products = [
    { id: 1, name: "Laptop", price: 55000 },
    { id: 2, name: "Mobile", price: 20000 },
    { id: 3, name: "Headphones", price: 1500 },
    { id: 4, name: "Smart Watch", price: 3000 },
    { id: 5, name: "Keyboard", price: 800 },
    { id: 6, name: "Mouse", price: 500 }
];

let cart = [];
let currentUser = null;
let order = null;

// EMAIL VALIDATION
function validEmail(email) {
    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return emailPattern.test(email);
}

// 1. USER REGISTRATION
function registerUser() {
    let name = prompt("Enter Your Name:");
    let email = prompt("Enter Your Email:");
    let password = prompt("Create Password:");

    if (!name || !email || !password) {
        console.log("Registration Failed! All fields are required.");
        return;
    }

    email = email.trim().toLowerCase();

    if (!validEmail(email)) {
        console.log("Invalid Email Format!");
        return;
    }

    if (users.find(function(user) {
        return user.email === email;
    })) {
        console.log("Email Already Registered!");
        return;
    }

    users.push({
        name: name,
        email: email,
        password: password
    });

    console.log("Registration Successful!");
    console.log("Customer Name:", name);
    console.log("Email:", email);
}

// 2. USER LOGIN
function loginUser() {
    let email = prompt("Enter Email:");

    if (!email || !validEmail(email.trim())) {
        console.log("Invalid Email Format!");
        return;
    }

    email = email.trim().toLowerCase();

    let password = prompt("Enter Password:");

    if (password === null) return;

    let user = users.find(function(u) {
        return u.email === email && u.password === password;
    });

    if (user) {
        currentUser = user;
        console.log("Login Successful!");
        console.log("Welcome", user.name);
    } else {
        console.log("Invalid Email or Password!");
    }
}

// 3. FORGOT PASSWORD
function forgotPassword() {
    let email = prompt("Enter Your Registered Email:");

    if (!email || !validEmail(email.trim())) {
        console.log("Invalid Email Format!");
        return;
    }

    email = email.trim().toLowerCase();

    let user = users.find(function(u) {
        return u.email === email;
    });

    if (!user) {
        console.log("Email Not Registered!");
        return;
    }

    let newPassword = prompt("Enter Your New Password:");

    if (!newPassword) {
        console.log("Password Cannot Be Empty!");
        return;
    }

    let confirmPassword = prompt("Confirm Your New Password:");

    if (newPassword !== confirmPassword) {
        console.log("Passwords Do Not Match!");
        return;
    }

    user.password = newPassword;

    console.log("Password Reset Successful!");
    console.log("You Can Now Login With Your New Password.");
}

// 4. DISPLAY PRODUCTS
function displayProducts() {
    console.log("===== AVAILABLE PRODUCTS =====");

    products.forEach(function(p) {
        console.log(
            "ID:", p.id,
            "| Product:", p.name,
            "| Price: Rs.", p.price
        );
    });
}

// 5. SEARCH PRODUCT
function searchProduct() {
    let name = prompt("Enter Product Name:");

    if (!name) {
        console.log("Please Enter a Product Name!");
        return;
    }

    let result = products.filter(function(p) {
        return p.name.toLowerCase().includes(name.trim().toLowerCase());
    });

    if (result.length > 0) {
        result.forEach(function(p) {
            console.log(
                "ID:", p.id,
                "| Product:", p.name,
                "| Price: Rs.", p.price
            );
        });
    } else {
        console.log("Product Not Found!");
    }
}

// 6. ADD TO CART
function addToCart() {
    let id = Number(prompt("Enter Product ID:"));

    let product = products.find(function(p) {
        return p.id === id;
    });

    if (!product) {
        console.log("Invalid Product ID!");
        return;
    }

    console.log("Product Selected Successfully!");
    console.log("Selected Product:", product.name);
    console.log("Product Price: Rs.", product.price);

    let quantity = Number(prompt("Enter Quantity:"));

    if (!Number.isInteger(quantity) || quantity <= 0) {
        console.log("Invalid Quantity!");
        return;
    }

    let existing = cart.find(function(item) {
        return item.id === id;
    });

    if (existing) {
        existing.quantity += quantity;
    } else {
        cart.push({
            id: product.id,
            name: product.name,
            price: product.price,
            quantity: quantity
        });
    }

    console.log("Product Added to Cart Successfully!");
    console.log("Product:", product.name);
}

// 7. CALCULATE PRICE
function calculatePrice() {
    if (cart.length === 0) {
        console.log("Your Cart is Empty!");
        return 0;
    }

    cart.forEach(function(item) {
        console.log(
            "Product:", item.name,
            "| Subtotal: Rs.", item.price * item.quantity
        );
    });

    let total = cart.reduce(function(sum, item) {
        return sum + item.price * item.quantity;
    }, 0);

    console.log("Total Price: Rs.", total);

    return total;
}

// 8. APPLY DISCOUNT
function applyDiscount(callback) {
    let total = callback();

    if (total === 0) return 0;

    let coupon = prompt(
        "Available Coupons:\n" +
        "SAVE10 - 10% Discount\n" +
        "SAVE20 - 20% Discount\n\n" +
        "Enter Coupon Code or Cancel for No Coupon:"
    );

    let discount = 0;

    if (coupon === null || coupon.trim() === "") {
        console.log("No Coupon Applied!");
    } else {
        coupon = coupon.trim().toUpperCase();

        if (coupon === "SAVE10") {
            discount = total * 0.10;
            console.log("SAVE10 Applied Successfully!");
        } else if (coupon === "SAVE20") {
            discount = total * 0.20;
            console.log("SAVE20 Applied Successfully!");
        } else {
            console.log("Invalid Coupon Code!");
        }
    }

    let amount = total - discount;

    console.log("Original Amount: Rs.", total);
    console.log("Discount: Rs.", discount);
    console.log("Amount After Discount: Rs.", amount);

    return amount;
}

// 9. CALCULATE GST
function calculateGST(amount) {
    let gst = amount * 0.18;
    let finalAmount = amount + gst;

    console.log("GST Rate: 18%");
    console.log("GST Amount: Rs.", gst.toFixed(2));
    console.log("Amount Including GST: Rs.", finalAmount.toFixed(2));

    return finalAmount;
}

// 10. PAYMENT
function payment(amount, callback) {
    let choice = Number(prompt(
        "Select Payment Method:\n" +
        "1. UPI\n" +
        "2. Debit Card\n" +
        "3. Credit Card\n" +
        "4. Cash on Delivery"
    ));

    let method = "";

    switch (choice) {
        case 1:
            method = "UPI";
            break;

        case 2:
            method = "Debit Card";
            break;

        case 3:
            method = "Credit Card";
            break;

        case 4:
            method = "Cash on Delivery";
            break;

        default:
            console.log("Invalid Payment Method!");
            return;
    }

    console.log("Payment Method:", method);
    console.log("Total Payable: Rs.", amount.toFixed(2));

    let confirmPayment = confirm(
        "Confirm Order of Rs." + amount.toFixed(2) +
        " using " + method + "?"
    );

    if (!confirmPayment) {
        console.log("Payment Cancelled!");
        return;
    }

    if (method === "Cash on Delivery") {
        console.log("Order Placed Successfully! Pay on Delivery.");
    } else {
        console.log("Payment Successful!");
    }

    callback(amount, method);
}

// 11. ORDER CONFIRMATION
function confirmOrder(amount, method) {
    order = {
        orderId: "ORD" + Date.now(),
        customer: currentUser.name,
        items: cart.map(function(item) {
            return { ...item };
        }),
        total: amount,
        payment: method,
        status: "Order Confirmed"
    };

    console.log("===== ORDER CONFIRMATION =====");
    console.log("Order ID:", order.orderId);
    console.log("Customer:", order.customer);

    console.log("Ordered Products:");

    order.items.forEach(function(item) {
        console.log(
            "Product:", item.name,
            "| Price: Rs.", item.price
        );
    });

    console.log("Total Amount: Rs.", order.total.toFixed(2));
    console.log("Payment Method:", order.payment);
    console.log("Order Status:", order.status);
    console.log("Thank You for Shopping!");

    cart = [];
}

// 12. CHECKOUT
function checkout() {
    if (cart.length === 0) {
        console.log("Your Cart is Empty!");
        return;
    }

    let discountedAmount = applyDiscount(calculatePrice);

    if (discountedAmount <= 0) return;

    let finalAmount = calculateGST(discountedAmount);

    payment(finalAmount, confirmOrder);
}

// 13. CHECK ORDER STATUS
function checkOrderStatus() {
    if (!order) {
        console.log("No Order Found!");
        return;
    }

    console.log("===== ORDER STATUS =====");
    console.log("Order ID:", order.orderId);
    console.log("Customer:", order.customer);
    console.log("Current Order Status:", order.status);

    let choice = Number(prompt(
        "Select Current Order Status:\n" +
        "1. Order Confirmed\n" +
        "2. Order Packed\n" +
        "3. Shipped\n" +
        "4. Out for Delivery\n" +
        "5. Delivered"
    ));

    let status = [
        "Order Confirmed",
        "Order Packed",
        "Shipped",
        "Out for Delivery",
        "Delivered"
    ];

    if (Number.isInteger(choice) && choice >= 1 && choice <= 5) {
        order.status = status[choice - 1];

        console.log("Order Status Updated Successfully!");
        console.log("Your Current Order Status:", order.status);
    } else {
        console.log("Invalid Status Choice!");
    }
}

// 14. MAIN APPLICATION
function shoppingApplication() {
    let choice;

    do {
        let input = prompt(
            "===== E-COMMERCE SHOPPING APPLICATION =====\n" +
            "1. User Registration\n" +
            "2. User Login\n" +
            "3. Forgot Password\n" +
            "4. Display Products\n" +
            "5. Search Product\n" +
            "6. Add to Cart\n" +
            "7. Calculate Price\n" +
            "8. Apply Discount and Checkout\n" +
            "9. Check Order Status\n" +
            "10. Exit\n\n" +
            "Enter Your Choice:"
        );

        if (input === null) {
            choice = 10;
        } else {
            choice = Number(input);
        }

        switch (choice) {
            case 1:
                registerUser();
                break;

            case 2:
                loginUser();
                break;

            case 3:
                forgotPassword();
                break;

            case 4:
                displayProducts();
                break;

            case 5:
                searchProduct();
                break;

            case 6:
                if (currentUser) {
                    addToCart();
                } else {
                    console.log("Please Login First!");
                }
                break;

            case 7:
                if (currentUser) {
                    calculatePrice();
                } else {
                    console.log("Please Login First!");
                }
                break;

            case 8:
                if (currentUser) {
                    checkout();
                } else {
                    console.log("Please Login First!");
                }
                break;

            case 9:
                checkOrderStatus();
                break;

            case 10:
                console.log("Thank You for Shopping!");
                break;

            default:
                console.log("Invalid Choice! Please Try Again.");
        }

    } while (choice !== 10);
}

// START APPLICATION
shoppingApplication();

</script>
